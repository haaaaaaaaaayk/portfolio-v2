<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f12">
<meta name="color-scheme" content="dark">
<title>Fogged Glass</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%231aedc5%27/%3E%3C/svg%3E">
  <script type="module" crossorigin src="/foggy_shinagawa/assets/index-C_PmfqAZ.js"></script>
  <link rel="stylesheet" crossorigin href="/foggy_shinagawa/assets/index-B3yzA8Mj.css">
</head>
<body>

<div id="stage"><canvas id="view" aria-label="Fogged window. Drag to draw on the glass."></canvas></div>

<!-- A note on the glass at every visit. Hidden until main.js shows it, after the window is up. -->
<section class="note glass" id="note" role="dialog" aria-labelledby="noteTitle" aria-describedby="noteBody" hidden>
  <button class="note-close" id="noteClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
  </button>
  <h1 id="noteTitle">Fogged Glass</h1>
  <div id="noteBody">
    <p>I spent a rainy season in Tokyo, living near Shinagawa Station, and took a lot of photos of the streets around it.</p>
    <p>I also had a habit of writing on fogged-up glass with my finger whenever I found some.</p>
  </div>
  <p class="note-how">Press and drag to draw on the glass.</p>
  <button class="note-go" id="noteGo" type="button">Start drawing</button>
</section>

<div class="dock" id="dock">
  <!-- One glass bar: settings unfold inside it, above the tools -->
  <div class="dock-inner glass" id="bar">
    <div class="drawer" id="panel" role="group" aria-label="Scene and brush" hidden>
      <div class="drawer-inner">
        <div class="group" id="scenes" role="group" aria-label="Scene behind the glass">
          <label class="swatch-add" data-tip="Add your photo">
            <input class="vh" type="file" id="photoInput" accept="image/*">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9"/></svg><span class="vh">Use your own photo</span>
          </label>
          <button class="swatch-add" type="button" id="takePhoto" data-tip="Take a photo" aria-label="Take a photo">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1H4l1-1.5h2l1 1.5h1.5a1 1 0 0 1 1 1v4.5a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1z"/><circle cx="6" cy="6.5" r="1.75"/></svg>
          </button>
          <!-- phones and tablets: the system camera, back lens first -->
          <input class="vh" type="file" id="cameraInput" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
        </div>
        <label class="ctl" for="size">Finger <input type="range" id="size" min="4" max="60" value="12"></label>
        <label class="ctl" for="wet">Wetness <input type="range" id="wet" min="0" max="100" value="55"></label>
        <label class="ctl" for="fog">Fog <input type="range" id="fog" min="0" max="100" value="12"></label>
      </div>
    </div>
    <div class="actions" id="actions" role="toolbar" aria-label="Tools">
      <button class="btn" data-tip="Scribble" id="scribble" type="button" aria-label="Scribble">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16c2-5 3.5-8 5-8 2 0 .5 7 3 7 2 0 2.5-5 4.5-5 1.8 0 1.5 4 5.5 4"/></svg>
      </button>
      <button class="btn" data-tip="Undo" id="undo" type="button" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="btn" data-tip="Wipe" id="wipe" type="button" aria-label="Wipe the glass">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20H9l-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4L12 19"/><path d="m18 13.3-6.3-6.3"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <!-- a download arrow, not a camera: the camera is Take a photo; this saves your drawing -->
      <button class="btn" data-tip="Save image" id="snap" type="button" aria-label="Save image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg>
      </button>
      <button class="btn" data-tip="Sound on" id="sound" type="button" aria-label="Squeak sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15"/><g class="waves"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M17.7 5a9 9 0 0 1 0 14"/></g><g class="mute"><path d="m16 10 4 4m0-4-4 4"/></g></svg>
      </button>
      <button class="btn" data-tip="Scene and brush" id="adjust" type="button" aria-label="Scene and brush" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h11M19 18h1"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      </button>
      <button class="btn" data-tip="Hide tools" id="hide" type="button" aria-label="Hide tools">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </div>
</div>
<button class="btn show glass" id="show" type="button" aria-label="Show tools" title="Show tools" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
</button>

<!-- Desktop camera: a live viewfinder on the same dimmed glass as the snapshot -->
<div class="shot cam" id="cam" role="dialog" aria-label="Take a photo" hidden>
  <figure>
    <div class="cam-frame">
      <video id="camVideo" playsinline muted></video>
      <span class="cam-flash" id="camFlash" aria-hidden="true"></span>
    </div>
    <p class="cam-msg" id="camMsg" hidden></p>
    <div class="cam-row">
      <button class="btn glass" id="camCancel" type="button">Cancel</button>
      <button class="shutter" id="camShutter" type="button" aria-label="Take the photo"></button>
      <span aria-hidden="true"></span>
    </div>
  </figure>
</div>

<div class="shot" id="shot" hidden>
  <figure>
    <img id="shotImg" alt="Snapshot of your fogged glass drawing">
    <div class="shot-row">
      <button class="btn glass" id="closeShot" type="button">Close</button>
      <button class="btn glass save" id="saveShot" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg>Save image
      </button>
    </div>
  </figure>
</div>

</body>
</html>
